[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-clinician"
version = "0.1.0"
description = "Auditable research platform for computable colorectal-cancer guidelines and longitudinal clinical AI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=2,<3",
  "openpyxl>=3.1,<4",
  "pydantic>=2.10,<3",
  "scikit-learn>=1.6,<2",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<9"]
foundation = ["torch>=2.4,<3"]

[project.scripts]
virtualhuman-agent = "virtualhuman_agents.cli:main"
ai-clinician = "ai_clinician.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"
